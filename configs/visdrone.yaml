# VisDrone2019-DET Dataset Configuration for YOLO
# Benchmark: AISKYEYE Team, Lab of Machine Learning and Data Mining, Tianjin University

path: datasets/visdrone # dataset root dir
train: images/train     # train images (relative to path)
val: images/val         # val images (relative to path)
test: images/test       # test images (optional)

# Number of evaluated ground classes
nc: 10

# Class names (Category 0 [ignored] and Category 11 [others] removed)
names:
  0: pedestrian
  1: people
  2: bicycle
  3: car
  4: van
  5: truck
  6: tricycle
  7: awning-tricycle
  8: bus
  9: motor
